name: Namoz TJ Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle environment
        run: gradle --version

      - name: Fetch CC0 Adhan audio
        run: |
          mkdir -p app/src/main/res/raw
          curl -fL --retry 3 --retry-delay 2 \
            -A "NamozTJ Android app (open-source project)" \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/Beautiful_adhan.ogg" \
            -o app/src/main/res/raw/azan.ogg
          test -s app/src/main/res/raw/adhan.ogg
          file app/src/main/res/raw/adhan.ogg

      - name: Remove documentation accidentally placed in Android res directories
        run: |
          rm -f app/src/main/res/drawable/README.md
          rm -f app/src/main/res/raw/CONTENT_SOURCES.md

      - name: Assemble debug APK
        run: gradle :app:test :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Namoz-TJ-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
